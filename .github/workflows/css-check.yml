name: css-check
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'src/tailwind.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: tailwind.css güncel mi?
        run: git diff --exit-code -- tailwind.css
